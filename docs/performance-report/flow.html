        root.querySelectorAll('[data-segment-start]').forEach(e=>{const a=Number(e.dataset.segmentStart),b=Number(e.dataset.segmentEnd);e.setAttribute('opacity',t>=a&&t<=b?.9:t>b?.6:.22);});
        const active=state.rows.filter(r=>r.end>r.start && r.start<=t && r.end>t && r.label!=='后端报告请求');
        let msg=active.length?active.map(r=>r.label).join(' ∥ '):progress>=1?'本条记录回放结束':'等待下一观测点';
        if(active.length===1)msg+='：'+active[0].detail;
        if(view==='turn'||view==='speaking'){const e=groups[view][sample],m=e.measurements,origin=view==='speaking'?m.t_speech_started:m.t_speech_stopped;if(t>=m.t_response_done-origin&&t<m.t_first_audible-origin)msg+=' response.done 已到，但尚未检测到起音。';}
        if(q('current').textContent!==msg)q('current').textContent=msg;
      }
    }
    function save(){if(window.openai&&window.openai.setWidgetState)window.openai.setWidgetState({modelContent:{view,sample,operation:groups[view]?.[sample]?.operation_Id||groups[view]?.[sample]?.request?.operation_Id||null},privateContent:{progress}}).catch(()=>{});}
    function stop(){playing=false;cancelAnimationFrame(frame);q('play').textContent=progress>=1?'重新播放':'播放过程';q('play').setAttribute('aria-pressed','false');root.dataset.playing='false';}
    function tick(now){if(!playing)return;if(!root.isConnected){stop();return;}const elapsed=Math.max(0,now-previous);if(reduced&&elapsed<900){frame=requestAnimationFrame(tick);return;}previous=now;const duration=view==='overview'?20000:view==='score'?20000:view==='speaking'?18000:14000;progress=Math.min(1,progress+elapsed/duration);update();if(progress>=1){stop();save();return;}frame=requestAnimationFrame(tick);}
    function configure(){stop();activePhase=-1;state=buildState();q('meta').textContent=state.meta;q('axis-caption').textContent=state.caption;q('cohort').textContent=view==='overview'?'语音 N4 / N7 · Judge N11':view==='score'?'独立评分样本 · N2':'真实记录 · N'+groups[view].length;q('sample-label').hidden=view==='overview';q('sample-caption').textContent=view==='score'?'报告开始时刻 · 北京时间':view==='judge'?'答案请求开始 · 北京时间':'事件记录时刻 · 北京时间';legend();draw();}
    function setView(next,selected){view=Object.hasOwn(groups,next)||next==='overview'?next:'overview';q('view').value=view;q('sample').replaceChildren();if(view!=='overview'){groups[view].forEach((e,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=e.label;q('sample').append(o);});sample=Math.max(0,Math.min(groups[view].length-1,selected??sampleMemory[view]??0));q('sample').value=String(sample);}else sample=0;progress=0;configure();}
    q('view').addEventListener('change',()=>{sampleMemory[view]=sample;setView(q('view').value);save();});
    q('sample').addEventListener('change',()=>{sample=Number(q('sample').value);sampleMemory[view]=sample;progress=0;configure();save();});
    q('play').addEventListener('click',()=>{if(playing){stop();save();return;}if(progress>=1){progress=0;update(false);}playing=true;previous=performance.now();q('play').textContent='暂停';q('play').setAttribute('aria-pressed','true');root.dataset.playing='true';frame=requestAnimationFrame(tick);});
    q('progress').addEventListener('input',()=>{stop();progress=Number(q('progress').value)/1000;update();if(progress>=1)q('play').textContent='重新播放';});q('progress').addEventListener('change',save);
    document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)stop();});
    function restore(saved){if(!saved)return;const s=saved.modelContent||saved,pv=saved.privateContent||saved;setView(s.view||'overview',Number.isInteger(s.sample)?s.sample:undefined);progress=Math.max(0,Math.min(1,Number(pv.progress)||0));update(false);}
    setView('overview');restore(window.openai?.widgetState);
    window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;if(s)restore(s);});
    let lastWidth=0;new ResizeObserver(entries=>{const w=entries[0].contentRect.width;if(Math.abs(w-lastWidth)>1){lastWidth=w;draw();}}).observe(q('chart'));
    root.dataset.ready='true';
  })();
  </script>
