<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>System architecture</title>
  <desc>Browser to the frontend container (SPA and /api proxy), to the internal backend (FastAPI), which calls PostgreSQL, Blob Storage, Azure AI Foundry, Voice Live and Document Intelligence with its managed identity; the avatar's media reaches the browser over WebRTC; GitHub Actions deploys through OIDC.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b4453"/>
    </marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b3fa0"/>
    </marker>
    <style>
      .zone { fill: #faf7f2; stroke: #ddd5c8; stroke-width: 1.5; }
      .zone-t { font-size: 14px; font-weight: 700; fill: #5a5160; }
      .box { fill: #fff; stroke: #b9aecb; stroke-width: 1.5; }
      .key { fill: #f1eafa; stroke: #6b3fa0; stroke-width: 2.2; }
      .ai { fill: #eef3fb; stroke: #5b7fb8; stroke-width: 1.6; }
      .data { fill: #eef5f1; stroke: #4f8a6b; stroke-width: 1.6; }
      .side { fill: #fff; stroke: #b9aecb; stroke-width: 1.4; stroke-dasharray: 5 4; }
      .t { font-size: 15px; font-weight: 600; fill: #2d2433; }
      .s { font-size: 12px; fill: #5a5160; }
      .l { font-size: 11.5px; font-weight: 600; fill: #6b3fa0; }
      .f { stroke: #4b4453; stroke-width: 2; fill: none; stroke-dasharray: 9 6; animation: flow 1.1s linear infinite; }
      .m { stroke: #6b3fa0; stroke-width: 2; fill: none; stroke-dasharray: 4 6; animation: flow 1.6s linear infinite; }
      .q { stroke: #9a90a6; stroke-width: 1.5; fill: none; stroke-dasharray: 3 5; }
      @keyframes flow { to { stroke-dashoffset: -30; } }
      @media (prefers-reduced-motion: reduce) { .f, .m { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="640" fill="#fff"/>

  <!-- Browser -->
  <rect class="box" x="20" y="190" width="150" height="170" rx="10"/>
  <text class="t" x="95" y="220" text-anchor="middle">Browser</text>
  <text class="s" x="95" y="244" text-anchor="middle">candidate · admin</text>
  <text class="s" x="95" y="272" text-anchor="middle">React 18 + TS</text>
  <text class="s" x="95" y="290" text-anchor="middle">Vite · Fluent UI v9</text>
  <text class="s" x="95" y="308" text-anchor="middle">TanStack Query</text>
  <text class="s" x="95" y="326" text-anchor="middle">i18next zh / en</text>

  <!-- Container Apps environment (VNet) -->
  <rect class="zone" x="200" y="40" width="650" height="460" rx="14"/>
  <text class="zone-t" x="220" y="66">Azure Container Apps · VNet (Sweden Central)</text>

  <rect class="box" x="240" y="190" width="150" height="170" rx="10"/>
  <text class="t" x="315" y="220" text-anchor="middle">Frontend</text>
  <text class="s" x="315" y="246" text-anchor="middle">nginx</text>
  <text class="s" x="315" y="264" text-anchor="middle">SPA + /api proxy</text>
  <text class="l" x="315" y="300" text-anchor="middle">public ingress</text>
  <text class="s" x="315" y="318" text-anchor="middle">(the only public URL)</text>

  <rect class="key" x="470" y="110" width="190" height="360" rx="12"/>
  <text class="t" x="565" y="140" text-anchor="middle">Backend</text>
  <text class="s" x="565" y="160" text-anchor="middle">Python 3.11 · FastAPI</text>
  <text class="s" x="565" y="176" text-anchor="middle">SQLAlchemy 2 · Alembic · JWT</text>
  <text class="s" x="488" y="214">• interview engine + judge</text>
  <text class="s" x="488" y="238">• scoring + report</text>
  <text class="s" x="488" y="262">• SOP pipeline</text>
  <text class="s" x="488" y="286">• Voice Live WS proxy</text>
  <text class="s" x="488" y="310">• admin API</text>
  <text class="l" x="565" y="448" text-anchor="middle">internal ingress</text>

  <rect class="data" x="700" y="270" width="130" height="90" rx="10"/>
  <text class="t" x="765" y="300" text-anchor="middle">PostgreSQL 16</text>
  <text class="s" x="765" y="322" text-anchor="middle">private</text>
  <text class="s" x="765" y="338" text-anchor="middle">Entra-only login</text>

  <rect class="data" x="700" y="380" width="130" height="90" rx="10"/>
  <text class="t" x="765" y="410" text-anchor="middle">Blob Storage</text>
  <text class="s" x="765" y="432" text-anchor="middle">private endpoint</text>
  <text class="s" x="765" y="448" text-anchor="middle">SOP originals</text>

  <!-- Azure AI services -->
  <rect class="ai" x="890" y="70" width="290" height="100" rx="10"/>
  <text class="t" x="1035" y="100" text-anchor="middle">Azure AI Foundry</text>
  <text class="s" x="1035" y="124" text-anchor="middle">chat model: scoring, judge,</text>
  <text class="s" x="1035" y="141" text-anchor="middle">rubric drafts, SOP summaries</text>
  <text class="s" x="1035" y="158" text-anchor="middle">agents (Responses API)</text>

  <rect class="ai" x="890" y="190" width="290" height="80" rx="10"/>
  <text class="t" x="1035" y="220" text-anchor="middle">Azure Voice Live</text>
  <text class="s" x="1035" y="244" text-anchor="middle">speech in · TTS · avatar</text>

  <rect class="ai" x="890" y="290" width="290" height="80" rx="10"/>
  <text class="t" x="1035" y="320" text-anchor="middle">Document Intelligence</text>
  <text class="s" x="1035" y="344" text-anchor="middle">SOP PDF → Markdown, every page</text>

  <rect class="side" x="890" y="400" width="290" height="70" rx="10"/>
  <text class="t" x="1035" y="428" text-anchor="middle">Foundry IQ</text>
  <text class="s" x="1035" y="450" text-anchor="middle">agent knowledge, Playground only</text>

  <!-- calls -->
  <path class="f" d="M170,275 L240,275" marker-end="url(#a)"/>
  <text class="l" x="205" y="266" text-anchor="middle">HTTPS</text>
  <path class="f" d="M390,275 L470,275" marker-end="url(#a)"/>
  <text class="l" x="430" y="266" text-anchor="middle">/api</text>
  <text class="l" x="430" y="294" text-anchor="middle">+ WS</text>

  <path class="f" d="M660,140 L890,140" marker-end="url(#a)"/>
  <path class="f" d="M660,205 L890,205" marker-end="url(#a)"/>
  <path class="f" d="M660,230 L868,230 L868,330 L890,330" marker-end="url(#a)"/>
  <path class="f" d="M660,315 L700,315" marker-end="url(#a)"/>
  <path class="f" d="M660,425 L700,425" marker-end="url(#a)"/>
  <text class="l" x="775" y="132" text-anchor="middle">managed identity, no keys</text>

  <!-- Foundry agent knowledge (Playground only) -->
  <path class="q" d="M1180,120 L1192,120 L1192,435 L1180,435"/>

  <!-- avatar media straight to the browser -->
  <path class="m" d="M95,360 L95,520 L880,520 L880,250 L890,250" marker-end="url(#ap)"/>
  <text class="l" x="480" y="514" text-anchor="middle">avatar video + audio · WebRTC</text>

  <!-- delivery -->
  <rect class="zone" x="20" y="555" width="1160" height="65" rx="12"/>
  <rect class="box" x="140" y="568" width="230" height="40" rx="8"/>
  <text class="t" x="255" y="593" text-anchor="middle">GitHub Actions</text>
  <rect class="box" x="480" y="568" width="230" height="40" rx="8"/>
  <text class="t" x="595" y="593" text-anchor="middle">Container Registry</text>
  <rect class="box" x="820" y="568" width="230" height="40" rx="8"/>
  <text class="t" x="935" y="593" text-anchor="middle">Container Apps · Bicep</text>
  <text class="zone-t" x="34" y="593">Deploy</text>
  <path class="f" d="M370,588 L480,588" marker-end="url(#a)"/>
  <text class="l" x="425" y="580" text-anchor="middle">OIDC, keyless</text>
  <path class="f" d="M710,588 L820,588" marker-end="url(#a)"/>
  <text class="l" x="765" y="580" text-anchor="middle">image</text>
</svg>
