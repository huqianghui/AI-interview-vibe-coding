<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1196 880" width="1196" height="880"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
     role="img" aria-label="A voice interview session end to end: browser, backend WebSocket proxy, session setup, then either the cascaded pipeline (chat model) or the speech-to-speech pipeline (realtime model); both end in Azure Speech TTS and the avatar. Scoring and the judge run separately, always on a chat model.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b5b7b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8178"/>
    </marker>
    <style>
      .t  { fill:#2b2520; font-size:14px; }
      .tt { fill:#2b2520; font-size:15.5px; font-weight:600; }
      .s  { fill:#6b625a; font-size:12px; }
      .m  { fill:#6b625a; font-size:11.5px; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .lane { fill:#4a4036; font-size:13px; font-weight:600; }
      .edge { stroke:#6b5b7b; stroke-width:1.6; fill:none; marker-end:url(#a); }
      .edge-g { stroke:#8a8178; stroke-width:1.4; fill:none; stroke-dasharray:5 4; marker-end:url(#ag); }
      .box { fill:#ffffff; stroke:#d9d2c8; stroke-width:1.2; rx:9; }
    </style>
  </defs>

  <rect x="0" y="0" width="1196" height="880" fill="#faf7f2"/>
  <text x="32" y="44" class="tt" font-size="20">A voice interview session, end to end</text>
  <text x="32" y="68" class="s">The voice model picked in /admin decides which pipeline runs; there is no other switch.</text>

  <!-- ===== 1: browser ===== -->
  <rect class="box" x="32" y="96" width="248" height="150"/>
  <text x="48" y="122" class="tt">① Browser</text>
  <text x="48" y="148" class="s">Microphone audio up (16 kHz)</text>
  <text x="48" y="170" class="s">Audio and captions back</text>
  <text x="48" y="192" class="s">Avatar video over WebRTC</text>
  <text x="48" y="222" class="s">One WebSocket carries it all</text>

  <!-- ===== 2: backend proxy ===== -->
  <rect class="box" x="328" y="96" width="268" height="150"/>
  <text x="344" y="122" class="tt">② Backend proxy</text>
  <text x="344" y="148" class="m">/api/voice-live/ws</text>
  <text x="344" y="172" class="s">Holds the Azure Voice Live</text>
  <text x="344" y="190" class="s">connection and relays both ways</text>
  <text x="344" y="222" class="s">Sets up the session (next box)</text>

  <!-- ===== 3: session setup ===== -->
  <rect class="box" x="644" y="96" width="504" height="150"/>
  <text x="660" y="122" class="tt">③ Session setup</text>
  <text x="660" y="148" class="s">Voice activity detection: 800 ms of silence ends a turn</text>
  <text x="660" y="170" class="s">Voice: an Azure Speech voice per interviewer and language</text>
  <text x="660" y="192" class="s">Transcription: Azure Speech · the avatar's look and video</text>
  <text x="660" y="222" class="s">Only the end-of-turn detector differs between the two pipelines ↓</text>

  <path class="edge" d="M280 171 L324 171"/>
  <path class="edge" d="M596 171 L640 171"/>

  <!-- ===== fork ===== -->
  <path class="edge" d="M896 246 L896 268 L300 268 L300 300"/>
  <path class="edge" d="M896 246 L896 268 L880 268 L880 300"/>

  <!-- ===== lane A: cascaded ===== -->
  <rect x="32" y="300" width="536" height="268" rx="12" fill="#f1ece3" stroke="#ddd5c9" stroke-width="1.2"/>
  <text x="52" y="326" class="lane">Cascaded — with a chat model (the default)</text>
  <text x="52" y="346" class="s">e.g. gpt-5-mini, or a bring-your-own model that is not realtime</text>

  <rect class="box" x="52" y="360" width="150" height="88"/>
  <text x="66" y="384" class="t">Listen</text>
  <text x="66" y="406" class="s">Azure speech-to-text</text>
  <text x="66" y="424" class="s">→ text</text>

  <rect class="box" x="218" y="360" width="166" height="88"/>
  <text x="232" y="384" class="t">End of turn</text>
  <text x="232" y="406" class="s">reads the transcript</text>
  <text x="232" y="424" class="s">waits 1.5 s</text>

  <rect class="box" x="400" y="360" width="150" height="88"/>
  <text x="414" y="384" class="t">Think</text>
  <text x="414" y="406" class="s">your chat model</text>
  <text x="414" y="424" class="s">text in, text out</text>

  <path class="edge" d="M202 404 L214 404"/>
  <path class="edge" d="M384 404 L396 404"/>
  <text x="52" y="492" class="s">An audio-based detector also works here, but measured</text>
  <text x="52" y="512" class="s">no better, so this pipeline keeps the text-based one.</text>

  <!-- ===== lane B: speech-to-speech ===== -->
  <rect x="612" y="300" width="536" height="268" rx="12" fill="#efe9f3" stroke="#d8cde0" stroke-width="1.2"/>
  <text x="632" y="326" class="lane">Speech-to-speech — with a realtime model</text>
  <text x="632" y="346" class="s">e.g. gpt-realtime, or a bring-your-own realtime model</text>

  <rect class="box" x="632" y="360" width="150" height="88"/>
  <text x="646" y="384" class="t">Listen</text>
  <text x="646" y="406" class="s">audio goes straight</text>
  <text x="646" y="424" class="s">to the model</text>

  <rect class="box" x="798" y="360" width="166" height="88"/>
  <text x="812" y="384" class="t">End of turn</text>
  <text x="812" y="406" class="s">reads the audio</text>
  <text x="812" y="424" class="s">waits 1.0 s</text>

  <rect class="box" x="980" y="360" width="150" height="88"/>
  <text x="994" y="384" class="t">Think</text>
  <text x="994" y="406" class="s">realtime model</text>
  <text x="994" y="424" class="s">audio in, audio out</text>

  <path class="edge" d="M782 404 L794 404"/>
  <path class="edge" d="M964 404 L976 404"/>
  <text x="632" y="492" class="s">Azure rejects a text-based detector here: there is no</text>
  <text x="632" y="512" class="s">transcript to read. 1.0 s measured best (1.5 s lags).</text>

  <!-- ===== converge ===== -->
  <path class="edge" d="M300 568 L300 596 L560 596 L560 620"/>
  <path class="edge" d="M880 568 L880 596 L620 596 L620 620"/>

  <!-- ===== 4: speak + avatar (shared) ===== -->
  <rect class="box" x="208" y="620" width="764" height="118" fill="#fdfbf7"/>
  <text x="228" y="648" class="tt">④ Speak + avatar — the same in both pipelines</text>
  <text x="228" y="674" class="t">Azure Speech TTS → lip-sync → avatar rendered by Azure → WebRTC to the browser</text>
  <text x="228" y="698" class="s">A realtime model is only the brain: the voice and the lip-sync always come from Azure TTS.</text>
  <text x="228" y="720" class="s">Questions are read word for word straight to TTS, bypassing the model, in both pipelines.</text>

  <path class="edge" d="M208 700 L20 700 L20 171 L30 171"/>
  <text x="13" y="520" class="s" transform="rotate(-90 13 520)">audio and video back to the browser</text>

  <!-- ===== inference leg ===== -->
  <rect x="32" y="762" width="1116" height="94" rx="12" fill="#f3f1ec" stroke="#ddd5c9" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="52" y="788" class="lane">Inference leg — outside the session, always a chat model</text>
  <text x="52" y="812" class="t">Live judge (wait / nudge) · scoring · rubric drafting · SOP coverage check · Foundry agent</text>
  <text x="52" y="836" class="s">Its input is the candidate's transcribed answer, not audio. Realtime models are refused on these text APIs, so evaluation stays on a chat model.</text>
  <path class="edge-g" d="M1148 212 L1166 212 L1166 782 L1152 782"/>
  <text x="1189" y="540" class="s" transform="rotate(-90 1189 540)">answer text</text>
</svg>
