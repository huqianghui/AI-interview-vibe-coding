name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheapest job, first: VERSION silently drifted FOUR releases before anything noticed. #166, #167
  # and #168 each wrote a CHANGELOG entry and a versioned PR title (0.43.0.0, 0.43.1.0, 0.43.2.0,
  # 0.44.0.0) without ever touching the VERSION file, which sat at 0.42.7.0 — so the repo's declared
  # version disagreed with its own release history and the next /ship run was about to pick a number
  # BELOW four already-published entries. Nothing caught it because nothing compared the two. This
  # does, in two seconds. (No workflow consumes VERSION for an image tag, so the damage was to
  # humans and docs rather than to a deploy — which is exactly why it went unnoticed for four turns.)
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VERSION matches the newest CHANGELOG entry
        run: |
          file=$(tr -d '[:space:]' < VERSION)
          top=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | awk '{print $2}')
          echo "VERSION file     = $file"
          echo "CHANGELOG newest = $top"
          if [ -z "$top" ]; then
            echo "::error::No 4-digit '## x.y.z.w' heading found in CHANGELOG.md."
            exit 1
          fi
          if [ "$file" != "$top" ]; then
            echo "::error::VERSION ($file) != newest CHANGELOG entry ($top). Bump VERSION in the same PR as its CHANGELOG entry."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # #102: SECRET_KEY is required at import time (no code default) — the migration step imports
      # app.models via alembic/env.py, and pytest's conftest sets the same throwaway value.
      SECRET_KEY: test-secret-key-do-not-use-in-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        # The azure extra too, even though CI never talks to Azure: 31 tests in
        # test_voice_live_proxy.py guard themselves with importorskip("azure") because
        # build_avatar_session / build_turn_detection construct SDK MODEL CLASSES (no network, no
        # credential). Without the extra CI silently skipped them, leaving the voice-session assembly
        # — the shape of every Voice Live session — unverified on the runner and voice_live_proxy.py
        # at 69%. With it: 766 passed / 0 skipped and that file at 100%, total coverage 84.95% ->
        # 85.57% (measured 2026-10-05, SDK present with every Azure endpoint env var blanked).
        run: pip install -e ".[dev,azure]"
      - name: Lint
        run: ruff check app tests
      - name: Format check
        run: ruff format --check app tests
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - name: Test (85% coverage gate)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # Full history: readme-screenshots-freshness.test.ts compares each screenshot's last commit
      # with the last commit to the components it shows. On the default shallow clone every file's
      # last commit is the same one, so that test passed vacuously and a stale image merged unseen.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E (real browser, mock providers)
        working-directory: frontend
        env:
          CI: "true"
          PY_BIN: python
          ALEMBIC_BIN: alembic
        run: npm run e2e
      # Failure forensics: keep the Playwright traces (recorded on first retry), error contexts and
      # report so an intermittent CI-only hang leaves a diagnosable crime scene instead of a dead
      # end — the 2026-09-10 candidate-flow hangs were unactionable without this.
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
