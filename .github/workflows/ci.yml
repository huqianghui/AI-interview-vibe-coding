name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # #102: SECRET_KEY is required at import time (no code default) — the migration step imports
      # app.models via alembic/env.py, and pytest's conftest sets the same throwaway value.
      SECRET_KEY: test-secret-key-do-not-use-in-prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        # The azure extra too, even though CI never talks to Azure: 31 tests in
        # test_voice_live_proxy.py guard themselves with importorskip("azure") because
        # build_avatar_session / build_turn_detection construct SDK MODEL CLASSES (no network, no
        # credential). Without the extra CI silently skipped them, leaving the voice-session assembly
        # — the shape of every Voice Live session — unverified on the runner and voice_live_proxy.py
        # at 69%. With it: 766 passed / 0 skipped and that file at 100%, total coverage 84.95% ->
        # 85.57% (measured 2026-10-05, SDK present with every Azure endpoint env var blanked).
        run: pip install -e ".[dev,azure]"
      - name: Lint
        run: ruff check app tests
      - name: Format check
        run: ruff format --check app tests
      - name: Migrations apply cleanly
        run: alembic upgrade head
      - name: Test (85% coverage gate)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E (real browser, mock providers)
        working-directory: frontend
        env:
          CI: "true"
          PY_BIN: python
          ALEMBIC_BIN: alembic
        run: npm run e2e
      # Failure forensics: keep the Playwright traces (recorded on first retry), error contexts and
      # report so an intermittent CI-only hang leaves a diagnosable crime scene instead of a dead
      # end — the 2026-09-10 candidate-flow hangs were unactionable without this.
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
