# nginx config for the AI-interview SPA + same-origin API reverse proxy.
#
# The frontend calls the backend at the relative path "/api" (frontend/src/api/client.ts), so there
# is no CORS: nginx serves the built SPA and reverse-proxies "/api/*" to the backend Container App.
# The backend serves its routes at ROOT (/health, /interview, /voice-live/ws, ...), and the Vite dev
# proxy strips the "/api" prefix — so this proxy MUST strip it too (note the trailing slash on
# proxy_pass) to match dev behaviour exactly.
#
# BACKEND_URL is substituted at container start by envsubst (see frontend Dockerfile) to the backend
# app's internal/ingress URL, e.g. https://ai-interview-backend.<region>.azurecontainerapps.io
#
# This file lands in /etc/nginx/conf.d/ (included inside the http{} block), so the http-level `map`
# below is valid here alongside the server{}.

# Standard WebSocket upgrade map: "Connection: upgrade" when the client sent an Upgrade header,
# "Connection: close" otherwise. Drives the /api/voice-live/ws proxy below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses. This was NOT on before (measured against the live public deployment
    # 2026-10-02: /assets/index-*.js returned 974978 bytes with NO `content-encoding`, byte-identical
    # whether the request asked for gzip or br) because nginx's own default `gzip_types` is
    # `text/html` ALONE — so the one file that actually matters, the ~950 KB bundle, was shipped raw.
    # That is ~700 KB of pure waste on every first visit, and it lands in the worst possible place:
    # the voice session is PREWARMED from page load (docs/avatar-latency-ice-gathering.md §5.2), so
    # every second the bundle spends in flight is a second the WS handshake has not started and the
    # candidate's cold start grows. `gzip_vary` is required because /assets/ is cached `immutable`
    # for a year — without it a shared cache could hand a gzipped body to a client that cannot
    # decode it. Level 5 rather than the default 1: these assets are content-hashed and fetched once
    # per release, so trading a few ms of CPU for a materially smaller body is the right side of the
    # curve on a 0.5 vCPU container. NOT using `gzip_static` (precompressed .gz at build time, which
    # would be strictly better): `ngx_http_gzip_static_module` could not be verified present in this
    # base image, and an unknown directive makes nginx refuse to start — a broken deploy is a worse
    # outcome than on-the-fly compression.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        text/javascript
        text/css
        application/json
        image/svg+xml
        application/manifest+json;

    # Container Apps health probe target.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Vite build assets are content-hashed (index-<hash>.js/css), so they are immutable: any code
    # change ships under a NEW filename referenced by a fresh index.html. Long browser/CDN caching
    # is therefore always safe — a backend/frontend release can never serve a stale file.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Self-hosted fonts (v0.41.0.0). These live in public/, so Vite copies them verbatim and their
    # filenames carry NO content hash — which means they would otherwise be served with no cache
    # headers at all and re-downloaded on every single visit: 206 KB per load, landing in exactly
    # the place the gzip note above cares about, since the voice session is prewarmed from page load
    # and every byte in flight delays the WS handshake. Cached for a year because the name encodes
    # the family, the subset and the axis range, so a different face is a different filename; a
    # re-subset of the SAME face is the one case that needs the version suffix bumped by hand (see
    # public/fonts/README.md).
    #
    # NOT gzipped, deliberately: woff2 carries Brotli compression inside the container format, so
    # re-compressing it burns CPU on a 0.5 vCPU box to make the body very slightly larger. That is
    # why `font/woff2` is absent from gzip_types above rather than merely forgotten.
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip off;
        try_files $uri =404;
    }

    # The entry document must NOT be cached: it is the one un-hashed file, and it names the current
    # hashed assets. no-cache forces a revalidation (ETag/304 — cheap) on every load so a new
    # release is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA client-side routing: deep links like /admin/agent/:id must fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API. The backend serves at root, so strip the "/api" prefix. NOTE: because
    # proxy_pass uses a variable (needed so the Container Apps FQDN is resolved at request time via
    # the resolver), nginx does NOT auto-strip the prefix — an explicit `rewrite ... break` does it.
    location /api/ {
        # The environment's own DNS (the container's /etc/resolv.conf nameserver) resolves the
        # backend FQDN at request time. It MUST be this one and not Azure DNS (168.63.129.16): the
        # backend's ingress is internal, and measured from this container 168.63.129.16 resolves the
        # `<app>.internal.<domain>` name to the environment's PUBLIC IP, while 127.0.0.11 returns
        # the in-cluster address (100.100.0.x) that internal ingress actually serves.
        resolver 127.0.0.11 valid=30s;
        set $backend "${BACKEND_URL}";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        # WebSocket upgrade for Voice Live's avatar path at /api/voice-live/ws (SPEC F9).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SNI + cert verification for the HTTPS upstream (Container Apps ingress terminates TLS).
        proxy_ssl_server_name on;

        # nginx's default body limit is 1 MB, which would 413 every SOP upload above it before the
        # backend's own limit (MATERIAL_MAX_SIZE_MB, 25 MB) is ever consulted. Kept just above it so
        # the backend stays the one that decides and explains.
        client_max_body_size 26m;

        # Voice Live sessions are long-lived; don't cut the WS/stream early.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
