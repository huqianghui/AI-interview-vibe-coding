# nginx config for the AI-interview SPA + same-origin API reverse proxy.
#
# The frontend calls the backend at the relative path "/api" (frontend/src/api/client.ts), so there
# is no CORS: nginx serves the built SPA and reverse-proxies "/api/*" to the backend Container App.
# The backend serves its routes at ROOT (/health, /interview, /voice-live/ws, ...), and the Vite dev
# proxy strips the "/api" prefix — so this proxy MUST strip it too (note the trailing slash on
# proxy_pass) to match dev behaviour exactly.
#
# BACKEND_URL is substituted at container start by envsubst (see frontend Dockerfile) to the backend
# app's internal/ingress URL, e.g. https://ai-interview-backend.<region>.azurecontainerapps.io
#
# This file lands in /etc/nginx/conf.d/ (included inside the http{} block), so the http-level `map`
# below is valid here alongside the server{}.

# Standard WebSocket upgrade map: "Connection: upgrade" when the client sent an Upgrade header,
# "Connection: close" otherwise. Drives the /api/voice-live/ws proxy below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container Apps health probe target.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # SPA client-side routing: deep links like /admin/agent/:id must fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API. The backend serves at root, so strip the "/api" prefix. NOTE: because
    # proxy_pass uses a variable (needed so the Container Apps FQDN is resolved at request time via
    # the resolver), nginx does NOT auto-strip the prefix — an explicit `rewrite ... break` does it.
    location /api/ {
        # Azure-provided DNS (168.63.129.16) resolves the backend FQDN at request time.
        resolver 168.63.129.16 valid=30s;
        set $backend "${BACKEND_URL}";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        # WebSocket upgrade for Voice Live's avatar path at /api/voice-live/ws (SPEC F9).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SNI + cert verification for the HTTPS upstream (Container Apps ingress terminates TLS).
        proxy_ssl_server_name on;

        # Voice Live sessions are long-lived; don't cut the WS/stream early.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
