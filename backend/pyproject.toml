[project]
name = "ai-interview-backend"
version = "0.1.0"
description = "AI Interview web app backend (SOP-based interviews with a digital-human interviewer)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
azure = [
    "openai>=1.54",
    "azure-ai-projects>=1.0.0b4",
    "azure-identity>=1.19",
    "azure-storage-blob>=12.24",
    "azure-ai-voicelive>=1.0.0b3",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=1.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI intentionally uses Depends()/Header() as argument defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
omit = [
    "app/services/agents/adapters/azure_*.py",
    "app/sop/binary_extractors.py",
    "alembic/*",
]
